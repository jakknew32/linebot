services:
  - type: web
    name: line-bot-reader
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn line_bot_webhook:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: DB_PATH
        value: /tmp/line_messages.db